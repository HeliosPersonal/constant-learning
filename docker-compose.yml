services:
  postgres:
    image: postgres:16-alpine
    container_name: constantlearning-postgres
    environment:
      POSTGRES_DB: constantlearning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - constantlearning

  app:
    build:
      context: .
      dockerfile: ConstantLearning/Dockerfile
    container_name: constantlearning-app
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8888
      
      # Підключення до бази даних
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=constantlearning;Username=postgres;Password=postgres"
      
      # ОБОВ’ЯЗКОВО: отримайте токен бота в Telegram через @BotFather
      Telegram__BotToken: "${TELEGRAM_BOT_TOKEN}"
      
      # ОБОВ’ЯЗКОВО для webhook: ваша публічна адреса (наприклад, https://yourdomain.com/api/telegram/webhook)
      # Для локальної розробки використовуйте ngrok: https://abc123.ngrok.io/api/telegram/webhook
      # Залиште порожнім, щоб не реєструвати webhook автоматично
      Telegram__WebhookUrl: "${TELEGRAM_WEBHOOK_URL:-}"
      
      # Налаштування навчання
      Learning__RepetitionWordsCount: "10"       # Кількість слів для повторення
      Learning__NewWordsCount: "3"               # Кількість нових слів на день
      Learning__AnswerDelaySeconds: "5"          # Затримка перед показом відповідей
      Learning__LearnedWordsChunkSize: "10"      # Слів у повідомленні команди /getalllearned
      
      # Налаштування мовної пари
      # Для англійської: TargetLanguage="English", TargetLanguageCode="en", CsvPath="/app/Resources/Words/words-english-ukrainian.csv"
      Language__TargetLanguage: "Polish"
      Language__SourceLanguage: "Ukrainian"
      Language__TargetLanguageCode: "pl"
      Language__SourceLanguageCode: "uk"         # Мова інтерфейсу: 'uk' або 'en'
      
      # Каталог із файлами слів CSV (імпортуються всі файли .csv)
      WordsImport__WordsFolder: "/app/Resources/Words"
    ports:
      - "8888:8888"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - constantlearning
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  constantlearning:
    driver: bridge
