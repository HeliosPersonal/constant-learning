apiVersion: apps/v1
kind: Deployment
metadata:
  name: constant-learning
spec:
  template:
    spec:
      containers:
        - name: constant-learning
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Staging"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: constant-learning-db
                  key: ConnectionStrings__DefaultConnection
