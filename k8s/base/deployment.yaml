apiVersion: apps/v1
kind: Deployment
metadata:
  name: constant-learning
  labels:
    app: constant-learning
spec:
  progressDeadlineSeconds: 540
  revisionHistoryLimit: 5
  replicas: 1
  # У пілоті не допускаємо одночасного запуску двох планувальників.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: constant-learning
  template:
    metadata:
      labels:
        app: constant-learning
    spec:
      imagePullSecrets:
        - name: constant-learning-ghcr
      containers:
        - name: constant-learning
          image: ghcr.io/GITHUB_USERNAME/constant-learning:SHA_REPLACED_BY_CICD
          ports:
            - containerPort: 8888
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8888"
          envFrom:
            - secretRef:
                name: constant-learning-telegram
            - secretRef:
                name: constant-learning-db
          startupProbe:
            httpGet:
              path: /api/telegram/health
              port: 8888
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /api/telegram/health
              port: 8888
            timeoutSeconds: 3
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/telegram/health
              port: 8888
            timeoutSeconds: 3
            initialDelaySeconds: 10
            periodSeconds: 20
