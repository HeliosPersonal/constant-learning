# Контракт HTTP API personal-trainer-mvp, згенерований /sdlc:api-forge (сценарій A).
#   поля й обмеження     ← data-model.md (кожне поле має походження, див. api-sync-report.md)
#   відповіді з помилками ← sad.md §6 (гілки alt/else)
#   перелік ендпоінтів   ← PRD.md §4 user stories / §5 AC
# Відхилення від дефолтів курсу (за ADR) записано в api-sync-report.md.
# CHANGELOG:
#   0.2.0 — додано POST /api/v1/learners/me/progress/reset (resetLearnerProgress) і схему
#           ProgressResetResult (фіча reset-progress, зворотно сумісне доповнення).
#   0.3.0 — фіча unlimited-learning: додано POST /api/v1/sessions/extra-word (startExtraWord) і
#           POST /api/v1/sessions/extra-practice (startExtraPractice); нове обов'язкове поле kind у Session
#           (SessionKind), нове обов'язкове поле extra_actions у TodaySummary (ExtraActions,
#           ExtraActionAvailability) і значення extra_new_word_check, extra_practice в enum SessionItem.kind.
#           Поля kind і extra_actions обов'язкові — несумісна зміна для клієнтів, що валідують строго.
#   0.4.0 — фіча learned-words-stats: додано GET /api/v1/stats/words (listLearnedWords),
#           GET /api/v1/stats/words/{entry_id} (getLearnedWordCard) і GET /api/v1/stats/summary
#           (getLearnedWordsSummary) зі схемами StatsTab, StatsSort, MistakeBreakdown, LearnedWordStat,
#           LearnedWordCard, LearnedWordsPage, LearnedWordsSummary. Лише читання наявних таблиць
#           (learner_words, answer_events, answer_neutralizations) — нових таблиць немає. Зворотно
#           сумісне доповнення (лише нові шляхи й схеми).
#   0.5.0 — додано GET /api/v1/learners/me/access (getLearnerAccess) зі схемою LearnerAccess:
#           чи має поточний користувач роль content editor (Mini App показує вхід до редактора лише
#           редакторам). Нових таблиць немає, зворотно сумісне доповнення.
#   0.6.0 — фіча multi-target-languages (злиття керування мовами в reference-контракт на інтеграції,
#           api-sync-report.md §B.5): додано GET /api/v1/languages (listTargetLanguages),
#           GET|POST /api/v1/learners/me/languages (listLearnerLanguages, startLearnerLanguage),
#           PUT /api/v1/learners/me/active-language (setActiveLanguage) зі схемами TargetLanguageCode,
#           TargetLanguage, TargetLanguageCatalog, LearnerLanguage, LearnerLanguages, StartLanguageRequest,
#           SetActiveLanguageRequest, ActiveLanguage. Додано значення language_switch_ms в enum ClientTiming.metric
#           (клієнтська телеметрія p95 перемикання мови, NFR ≤1500 ms). Зворотно сумісне доповнення
#           (лише нові шляхи, схеми й значення enum). Черга редактора за мовою — окремо в T16.
openapi: 3.1.0

info:
  title: personal-trainer-mvp API
  version: 0.6.0
  description: |
    API персонального тренера польських слів для україномовних learner. Mini App у Telegram
    використовує його для онбордингу, щоденних session з вправами пригадування, екрана «Сьогодні»,
    пошуку в словнику, налаштувань і content reports; content editor — для черги непідтверджених
    content reports. Сервер — єдине джерело істини навчального стану (ADR-0008): оцінка відповіді,
    межі доби learner і планування повторень відбуваються тут, а клієнт лише відмальовує результат.

servers:
  - url: https://trainer.example.test
    description: Production (той самий origin, що й Mini App — ADR-0002)
  - url: http://localhost:8888
    description: Local

# Глобальна автентифікація — підписані initData Telegram у кожному запиті (ADR-0005),
# а не BearerAuth з дефолтів курсу. Публічні операції оголошують security: [].
security:
  - TelegramInitData: []

tags:
  - name: learner
  - name: languages
  - name: learning
  - name: dictionary
  - name: content-reports
  - name: editor
  - name: bot
  - name: telemetry

paths:
  /api/v1/learners/me/onboarding:
    post:
      tags: [learner]
      summary: Завершити онбординг (US-01)
      operationId: completeOnboarding
      description: |
        Створює learner за ідентичністю з initData. Якщо часовий пояс не передано або він невідомий,
        доба рахується за Europe/Warsaw, а `time_zone_confirmed` = false (AC-01). Якщо learner уже
        існує, повертає його без змін і без помилки — значення з тіла запиту ігноруються (AC-53).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingRequest" }
            example:
              daily_new_words_limit: 5
              time_zone: Europe/Warsaw
              reminder: null
      responses:
        "201":
          description: learner створено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Learner" }
              example:
                id: 0192f0a0-0000-7000-8000-000000000001
                first_name: Test User
                time_zone: Europe/Warsaw
                time_zone_confirmed: true
                daily_new_words_limit: 5
                pending_daily_new_words_limit: null
                reminder: null
                onboarded_at: "2026-10-31T09:00:00Z"
                active_target_language: null
        "200":
          description: learner уже існує — повернуто наявні налаштування без змін (AC-53)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Learner" }
              example:
                id: 0192f0a0-0000-7000-8000-000000000001
                first_name: Test User
                time_zone: Europe/Warsaw
                time_zone_confirmed: true
                daily_new_words_limit: 5
                pending_daily_new_words_limit: null
                reminder:
                  local_time: "19:00"
                  days_of_week: [mon, wed, fri]
                onboarded_at: "2026-10-30T09:00:00Z"
                active_target_language: null
        "400":
          description: Невалідні налаштування (AC-02, AC-45)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: settings.reminder_days_required
                message: Виберіть хоча б один день або пропустіть налаштування нагадувань.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/learners/me:
    get:
      tags: [learner]
      summary: Профіль і налаштування learner
      operationId: getCurrentLearner
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Learner" }
              example:
                id: 0192f0a0-0000-7000-8000-000000000001
                first_name: Test User
                time_zone: Europe/Warsaw
                time_zone_confirmed: true
                daily_new_words_limit: 5
                pending_daily_new_words_limit: null
                reminder:
                  local_time: "19:00"
                  days_of_week: [mon, wed, fri]
                onboarded_at: "2026-10-31T09:00:00Z"
                active_target_language: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Онбординг ще не завершено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: learner.not_onboarded
                message: Спершу налаштуйте тренер.

  /api/v1/learners/me/access:
    get:
      tags: [learner]
      summary: Ролі поточного користувача
      description: Не потребує завершеного онбордингу. Лише повідомляє, чи є користувач content editor; сам доступ до редакторських ендпоінтів перевіряє сервер.
      operationId: getLearnerAccess
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerAccess" }
              example:
                content_editor: false
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/languages:
    get:
      tags: [languages]
      summary: Каталог target languages для вибору (multi-target-languages US-01)
      operationId: listTargetLanguages
      description: |
        Повертає мови у порядку sort_order. `available` = true, лише коли мова увімкнена
        (is_enabled) І має щонайменше один схвалений запис словника — лише такі learner може
        почати (AC-01, AC-02). Набір обмежений (≈4 мови), тож повертається повним списком без
        курсорної пагінації. Доступно до завершення онбордингу — learner бачить вибір мов одразу.
      responses:
        "200":
          description: Повний каталог мов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetLanguageCatalog" }
              example:
                items:
                  - { code: pl, display_name_uk: Польська, is_enabled: true, sort_order: 1, available: true }
                  - { code: en, display_name_uk: Англійська, is_enabled: false, sort_order: 2, available: false }
                  - { code: de, display_name_uk: Німецька, is_enabled: false, sort_order: 3, available: false }
                  - { code: nl, display_name_uk: Нідерландська, is_enabled: false, sort_order: 4, available: false }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/learners/me/languages:
    get:
      tags: [languages]
      summary: Мови, які learner вивчає, і активна (multi-target-languages US-02, US-03)
      operationId: listLearnerLanguages
      description: |
        Повертає рядки learner_language_states цього learner — кожна мова, яку він веде, з
        окремим обліком, і яка з них активна (active_target_language). Прогрес іншого learner
        недоступний (AC-10). Порожній список items означає, що learner ще не почав жодної мови.
      responses:
        "200":
          description: Мови learner та активна мова
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerLanguages" }
              example:
                active_target_language: en
                items:
                  - { target_language: pl, display_name_uk: Польська, is_active: false, started_at: "2026-10-20T09:00:00Z" }
                  - { target_language: en, display_name_uk: Англійська, is_active: true, started_at: "2026-11-01T09:00:00Z" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/LearnerNotOnboarded" }
    post:
      tags: [languages]
      summary: Почати вивчати мову (multi-target-languages US-01)
      operationId: startLearnerLanguage
      description: |
        Починає вести вказану мову для learner окремо — створює рядок learner_language_states з
        власним станом доби й обліком нових слів і робить мову активною (AC-01, flow 1). Якщо
        learner уже вивчає цю мову, повертає її без змін (200) — повтор через застаріле
        посилання, другу вкладку чи повторне натискання безпечний і не веде мову вдруге (AC-12,
        flow 4). Природний ключ ідемпотентності — (learner, target_language), тож окремий
        Idempotency-Key не потрібен.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartLanguageRequest" }
            example:
              target_language: en
      responses:
        "200":
          description: learner уже вивчає цю мову — повернуто наявний стан без змін (AC-12)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerLanguage" }
              example:
                target_language: en
                display_name_uk: Англійська
                is_active: true
                started_at: "2026-11-01T09:00:00Z"
        "201":
          description: Мову почато, вона стала активною (AC-01)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerLanguage" }
              example:
                target_language: en
                display_name_uk: Англійська
                is_active: true
                started_at: "2026-11-04T09:00:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Такої мови немає в каталозі (невідомий код)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: language.unknown
                message: Такої мови немає.
        "409":
          description: |
            Мова недоступна для старту — вимкнена або без схваленого контенту; активна мова
            лишається без змін (AC-02, flow 3). Або конкурентний запис з іншої вкладки
            відхилено за оптимістичною конкурентністю — повторіть на свіжому стані (flow 4, OQ-4).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                not_available:
                  value:
                    code: language.not_available
                    message: Ця мова поки недоступна.
                concurrent_update:
                  value:
                    code: language.concurrent_update
                    message: Стан змінився — повторіть спробу.

  /api/v1/learners/me/active-language:
    put:
      tags: [languages]
      summary: Перемкнути активну мову (multi-target-languages US-02)
      operationId: setActiveLanguage
      description: |
        Робить вказану мову активною: екран «Сьогодні», заняття, словник і налаштування
        показують її стан, а облік решти мов лишається незмінним і доступним після зворотного
        перемикання (AC-03, flow 1). Незавершена session попередньої мови лишається доступною
        для продовження в межах доби своєї мови (AC-04). Перемикати можна лише мову, яку learner
        уже вивчає — почати нову слід через POST /learners/me/languages. Повтор на вже активній
        мові безпечний (200).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetActiveLanguageRequest" }
            example:
              target_language: pl
      responses:
        "200":
          description: Активну мову перемкнено (або вже була активна)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveLanguage" }
              example:
                active_target_language: pl
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/LearnerNotOnboarded" }
        "409":
          description: |
            learner ще не вивчає цю мову — її не можна зробити активною без старту (AC-03). Або
            конкурентне перемикання відхилено за оптимістичною конкурентністю (flow 4, OQ-4).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                not_studying:
                  value:
                    code: language.not_studying
                    message: Спершу почніть вивчати цю мову.
                concurrent_update:
                  value:
                    code: language.concurrent_update
                    message: Стан змінився — повторіть спробу.

  /api/v1/learners/me/settings:
    patch:
      tags: [learner]
      summary: Змінити темп, часовий пояс або нагадування (US-06, US-11)
      operationId: updateLearnerSettings
      description: |
        Новий ліміт діє з початку наступної доби в новому поясі (AC-44). `reminder: null` вимикає
        нагадування. Не більше одного нагадування на календарну дату, навіть після зміни поясу.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearnerSettingsUpdate" }
            example:
              daily_new_words_limit: 10
              time_zone: Europe/Kyiv
      responses:
        "200":
          description: Налаштування збережено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Learner" }
              example:
                id: 0192f0a0-0000-7000-8000-000000000001
                first_name: Test User
                time_zone: Europe/Kyiv
                time_zone_confirmed: true
                daily_new_words_limit: 5
                pending_daily_new_words_limit: 10
                reminder:
                  local_time: "19:00"
                  days_of_week: [mon]
                onboarded_at: "2026-10-31T09:00:00Z"
                active_target_language: null
        "400":
          description: Невалідні налаштування (AC-02, AC-27, AC-45)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                invalid_limit:
                  value:
                    code: settings.invalid_limit
                    message: Доступно від 1 до 10 нових слів на день.
                time_zone_required:
                  value:
                    code: settings.time_zone_required
                    message: Виберіть часовий пояс, щоб налаштувати нагадування.
                invalid_time_zone:
                  value:
                    code: settings.invalid_time_zone
                    message: Невідомий часовий пояс.
                reminder_days_required:
                  value:
                    code: settings.reminder_days_required
                    message: Виберіть хоча б один день тижня.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/LearnerNotOnboarded" }

  /api/v1/today:
    get:
      tags: [learning]
      summary: Екран «Сьогодні» (US-07)
      operationId: getToday
      responses:
        "200":
          description: Лічильники лише цього learner (AC-28, AC-29)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TodaySummary" }
              example:
                learner_day: "2026-10-31"
                due_review_count: 7
                recalled_words_count: 12
                completed_sessions_last_7_days: 3
                has_active_session: false
                course_state: in_progress
                course_replenished_notice: false
                new_words_available_today: true
                extra_actions:
                  plan_done: false
                  extra_new_word: { available: false, reason: plan_not_done }
                  extra_practice: { available: false, reason: plan_not_done }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/LearnerNotOnboarded" }

  /api/v1/sessions:
    post:
      tags: [learning]
      summary: Почати session або повернути активну (US-02)
      operationId: startSession
      description: |
        Складає session не більше ніж на 20 слів: спершу найбільш прострочені повторення, потім нові
        слова у вільних місцях у межах залишку денного ліміту (AC-03–AC-10). Якщо активна session
        цієї доби вже є, повертає її (200) — повторний виклик безпечний.
      responses:
        "200":
          description: Активна session уже існує
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
              examples:
                active:
                  $ref: "#/components/examples/SessionExample"
        "201":
          description: Session створено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
              example:
                id: 0192f0a0-0000-7000-8000-0000000000a1
                learner_day: "2026-10-31"
                ends_at: "2026-10-31T23:00:00Z"
                status: active
                kind: plan
                total_items: 7
                completed_items: 0
                notices: [new_words_limit_reached]
                last_result: null
                current_item:
                  id: 0192f0a0-0000-7000-8000-0000000000b1
                  position: 1
                  kind: review
                  prompt_uk: так
                  context_uk: null
                  card: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/LearnerNotOnboarded" }

  /api/v1/sessions/extra-word:
    post:
      tags: [learning]
      summary: Взяти ще одне нове слово понад план дня (US-01, unlimited-learning)
      operationId: startExtraWord
      description: |
        Створює session kind = extra_word з карткою наступного нового слова в порядку вибору базового
        курсу (AC-01). Дозволено лише коли план дня виконано (AC-16, AC-17). Нове слово не рахується до
        денного ліміту (AC-02). Якщо активна extra-session уже існує, повертає її (200) — повторне
        натискання й другий пристрій безпечні (AC-05), тож окремий Idempotency-Key не потрібен.
        Технічний захист: не більше 30 викликів на хвилину на learner.
      responses:
        "200":
          description: Активна extra-session уже існує (повторне натискання або інший пристрій)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "201":
          description: Extra-session створено, повернуто картку слова
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
              example:
                id: 0192f0a0-0000-7000-8000-0000000000c1
                learner_day: "2026-10-31"
                ends_at: "2026-10-31T23:00:00Z"
                status: active
                kind: extra_word
                total_items: 2
                completed_items: 0
                notices: []
                last_result: null
                current_item:
                  id: 0192f0a0-0000-7000-8000-0000000000d1
                  position: 1
                  kind: new_word_card
                  prompt_uk: хата
                  context_uk: null
                  card:
                    lemma_pl: chata
                    translations_uk: [хата]
                    pronunciation_uk: хата
                    example_pl: Mieszkam w małej chacie.
                    example_uk: Я живу в маленькій хаті.
                    gender: f
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/LearnerNotOnboarded" }
        "409":
          description: Додаткове слово зараз недоступне — або план дня не виконано, або base course завершено (AC-04, AC-17)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                plan_not_done:
                  value:
                    code: extra.plan_not_done
                    message: Спершу завершіть заняття за планом — потім можна брати додаткові слова.
                course_completed:
                  value:
                    code: extra.course_completed
                    message: Нових слів у курсі більше немає.
        "429":
          description: Забагато натискань за хвилину (технічний захист від зловживань, не навчальний ліміт)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: extra.rate_limited
                message: Занадто швидко — зачекайте кілька секунд.

  /api/v1/sessions/extra-practice:
    post:
      tags: [learning]
      summary: Почати додаткову практику вивчених слів (US-02, unlimited-learning)
      operationId: startExtraPractice
      description: |
        Створює session kind = extra_practice до 20 карток зі слів зі статусом «На повторення» або
        «Вже пригадую»; порядок — найближча дата наступного повторення (AC-08). Не пропонує слів із
        control repetition, слів із відповіддю сьогодні, слів, отриманих сьогодні, і слів, що втратили
        approved (AC-09, AC-11). Якщо активна extra-session уже існує, повертає її (200). Практика не
        зсуває інтервал і дату повторення (ADR-0002).
      responses:
        "200":
          description: Активна extra-session уже існує
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "201":
          description: Практику створено, повернуто першу картку
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
              example:
                id: 0192f0a0-0000-7000-8000-0000000000c2
                learner_day: "2026-10-31"
                ends_at: "2026-10-31T23:00:00Z"
                status: active
                kind: extra_practice
                total_items: 12
                completed_items: 0
                notices: []
                last_result: null
                current_item:
                  id: 0192f0a0-0000-7000-8000-0000000000d2
                  position: 1
                  kind: extra_practice
                  prompt_uk: хата
                  context_uk: null
                  card: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/LearnerNotOnboarded" }
        "409":
          description: Практика недоступна — план дня не виконано або немає придатних слів (AC-10, AC-17)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                plan_not_done:
                  value:
                    code: extra.plan_not_done
                    message: Спершу завершіть заняття за планом — потім можна тренуватися додатково.
                no_eligible_words:
                  value:
                    code: extra.no_eligible_words
                    message: Зараз немає слів для додаткової практики — спробуйте, коли будуть вивчені слова без відповіді сьогодні.

  /api/v1/sessions/current:
    get:
      tags: [learning]
      summary: Поточна session для продовження (US-05)
      operationId: getCurrentSession
      description: |
        Повертає відкритий результат або наступну картку session тієї самої доби (AC-24).
        Завершена session із відкритим результатом також повертається до кінця доби. Після
        межі доби активна session закривається як незавершена (AC-25).
      responses:
        "200":
          description: Активна session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
              example:
                id: 0192f0a0-0000-7000-8000-0000000000a1
                learner_day: "2026-10-31"
                ends_at: "2026-10-31T23:00:00Z"
                status: active
                kind: plan
                total_items: 10
                completed_items: 6
                notices: []
                last_result: null
                current_item:
                  id: 0192f0a0-0000-7000-8000-0000000000b7
                  position: 7
                  kind: review
                  prompt_uk: мати
                  context_uk: null
                  card: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Активної session немає (зокрема закрита після межі доби)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: session.not_found
                message: Активного заняття немає — можна почати нове.

  /api/v1/sessions/{session_id}/items/{item_id}/answer:
    post:
      tags: [learning]
      summary: Відповісти на вправу пригадування (US-03, US-04)
      operationId: answerSessionItem
      description: |
        Картка session — природний ключ ідемпотентності (ADR-0008): повтор із тим самим вмістом
        повертає збережений результат, з іншим — відмову. Оцінка, запис події відповіді й стану
        слова відбуваються в одній транзакції. Окремий заголовок Idempotency-Key не потрібен.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerRequest" }
            example:
              answer: żaba
              dont_know: false
      responses:
        "200":
          description: Результат оцінки (AC-12, AC-14–AC-16, AC-18, AC-19, AC-22, AC-23)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnswerResult" }
              example:
                answer_event_id: 0192f0a0-0000-7000-8000-0000000000c1
                outcome: mistake_diacritic
                correct_form: żaba
                diff:
                  - { op: substitute, expected: ż, actual: z }
                  - { op: equal, expected: aba, actual: aba }
                pronunciation_uk: жаба
                example_pl: To jest żaba.
                example_uk: Це жаба.
                gender: f
                dispute_allowed: false
                word_status: review
                next_review_on: "2026-11-01"
                next_item: null
                session_completed: false
        "400":
          description: Порожня відповідь (AC-13) або кириличні літери після нормалізації (AC-57)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                empty:
                  value:
                    code: answer.empty
                    message: Введіть слово або натисніть «Не знаю».
                wrong_layout:
                  value:
                    code: answer.wrong_layout
                    message: Перемкніть розкладку на польську або натисніть «Не знаю».
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/SessionItemNotFound" }
        "409":
          description: Картку вже оцінено іншою відповіддю або доба session минула (AC-52) — дію не зараховано, session закрито
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                answered_differently:
                  value:
                    code: answer.already_answered_differently
                    message: Цю картку вже оцінено.
                expired:
                  value:
                    code: session.expired
                    message: Заняття минулої доби закрито — почніть нове.

  /api/v1/sessions/{session_id}/items/{item_id}/acknowledge:
    post:
      tags: [learning]
      summary: Позначити картку нового слова переглянутою — «Далі» (AC-11)
      operationId: acknowledgeNewWordCard
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Картку зафіксовано як показану; повтор безпечний
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionProgress" }
              example:
                next_item:
                  id: 0192f0a0-0000-7000-8000-0000000000b2
                  position: 2
                  kind: new_word_card
                  prompt_uk: для
                  context_uk: null
                  card:
                    lemma_pl: dla
                    translations_uk: [для]
                    pronunciation_uk: для
                    example_pl: To dla ciebie.
                    example_uk: Це для тебе.
                    gender: null
                session_completed: false
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/SessionItemNotFound" }
        "409": { $ref: "#/components/responses/SessionExpired" }

  /api/v1/sessions/{session_id}/items/{item_id}/already-known:
    post:
      tags: [learning]
      summary: «Вже знаю» на картці нового слова (US-04)
      operationId: markAlreadyKnown
      description: |
        Ставить control repetition через 7 діб і word status «На повторення». Додає нове слово на
        заміну, якщо за добу позначено менше 10 слів (AC-20); інакше заміни немає, а слово
        рахується до daily new words limit поточної доби (AC-21). Повтор безпечний.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Слово відкладено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlreadyKnownResult" }
              example:
                control_repetition_on: "2026-11-07"
                replacement_added: true
                next_item:
                  id: 0192f0a0-0000-7000-8000-0000000000b3
                  position: 3
                  kind: new_word_card
                  prompt_uk: мати
                  context_uk: null
                  card:
                    lemma_pl: mieć
                    translations_uk: [мати]
                    pronunciation_uk: мєчь
                    example_pl: Mam czas.
                    example_uk: Я маю час.
                    gender: null
                session_completed: false
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/SessionItemNotFound" }
        "409": { $ref: "#/components/responses/SessionExpired" }

  /api/v1/sessions/{session_id}/items/{item_id}/continue:
    post:
      tags: [learning]
      summary: Перейти з результату відповіді до наступної картки
      operationId: continueSession
      description: Повторний виклик не закриває результат новішої картки; повертає поточний стан заняття.
      parameters:
        - { in: path, name: session_id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: item_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Поточний стан заняття
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/SessionItemNotFound" }
        "409": { $ref: "#/components/responses/SessionExpired" }

  /api/v1/answers/{answer_event_id}/dispute:
    post:
      tags: [learning, content-reports]
      summary: «Моя відповідь теж правильна» (AC-17, AC-55)
      operationId: disputeAnswer
      description: |
        Скасовує mistake, відновлює стан слова до відповіді й створює content report із введеним
        варіантом. Для перевірки нового слова перше повторення лишається наступної доби (AC-55).
        Не більше одного report на оцінену відповідь, тож він не рахується до денного ліміту
        20 reports і доступний навіть після його вичерпання (AC-47). Повторний виклик повертає
        той самий результат.
      parameters:
        - in: path
          name: answer_event_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Відповідь нейтралізовано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeResult" }
              example:
                outcome: neutralized
                content_report_id: 0192f0a0-0000-7000-8000-0000000000d1
                message: Дякуємо, передали на перевірку
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Відповідь не знайдено серед відповідей цього learner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: answer.not_found
                message: Відповідь не знайдено.
        "409":
          description: "Дія недоступна — відмінність у діакритиці (AC-15) або вікно минуло: показано наступну картку чи закінчилась доба (AC-17)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: answer.dispute_not_allowed
                message: Для відмінності в діакритичному знаку ця дія недоступна.

  /api/v1/dictionary/search:
    get:
      tags: [dictionary]
      summary: Пошук у словнику (US-08)
      operationId: searchDictionary
      description: |
        Запит з 1 символу — лише точний збіг, від 2 символів — і збіги за початком; діакритика
        ігнорується; точний збіг першим, далі за порядком base course; лише записи `approved`
        (AC-30, AC-32, AC-33). Клієнт скасовує застарілий запит, debounce немає.
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - in: query
          name: after
          description: курсор — id останньої побаченої леми
          schema: { type: string, format: uuid }
        - in: query
          name: before
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Результати; порожній список означає «Не знайшли слово» (AC-31)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DictionarySearchPage" }
              example:
                items:
                  - entry_id: 0192f0a0-0000-7000-8000-0000000000e1
                    lemma_pl: urząd
                    part_of_speech: noun
                    short_meaning_uk: державна установа
                    matched_form: urzedzie
                    word_status: not_started
                has_next: false
                has_prev: false
                next_cursor: null
        "400":
          description: Порожній запит
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: dictionary.query_empty
                message: Введіть слово для пошуку.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/dictionary/entries/{entry_id}:
    get:
      tags: [dictionary]
      summary: Картка слова з особистим word status (US-08)
      operationId: getDictionaryEntry
      parameters:
        - in: path
          name: entry_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Опублікована версія запису; перегляд не змінює порядок занять
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DictionaryEntryCard" }
              example:
                entry_id: 0192f0a0-0000-7000-8000-0000000000e1
                lemma_pl: urząd
                part_of_speech: noun
                gender: m
                translations_uk:
                  - { kind: canonical, text_uk: державна установа }
                  - { kind: local, text_uk: ужонд }
                pronunciation_uk: ужонд
                example_pl: Idę do urzędu.
                example_uk: Я йду до державної установи.
                word_status: review
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Запису немає або він не має статусу approved (AC-33)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: dictionary.entry_not_found
                message: Слово не знайдено.

  /api/v1/stats/words:
    get:
      tags: [learning]
      summary: Список вивчених слів з особистою статистикою (learned-words-stats US-01)
      operationId: listLearnedWords
      description: |
        Повертає лише слова, які learner уже бачив (мають learner_word; вкладка «Усі» ніколи не розкриває
        порядок непоказаних слів курсу). Фільтр `tab`: all — усі побачені; recalled — status = recalled;
        review — status = review. `sort`: recent — за датою останнього повторення; alpha — за лемою;
        weakest — спершу найслабші. Необов'язковий `q` звужує за лемою або перекладом. Пагінація курсором
        за entry_id. Усі лічильники сервер рахує наживо з answer_events (за винятком успішно оскаржених
        помилок — answer_neutralizations); статус — з learner_words.
      parameters:
        - in: query
          name: tab
          schema: { $ref: "#/components/schemas/StatsTab" }
        - in: query
          name: sort
          schema: { $ref: "#/components/schemas/StatsSort" }
        - in: query
          name: q
          schema: { type: string, minLength: 1, maxLength: 200 }
        - in: query
          name: after
          description: курсор — entry_id останнього побаченого слова
          schema: { type: string, format: uuid }
        - in: query
          name: before
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Сторінка статистики; порожній список означає, що вивчених слів ще немає
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnedWordsPage" }
              example:
                items:
                  - entry_id: 0192f0a0-0000-7000-8000-0000000000e1
                    lemma_pl: chata
                    transcription_uk: хата
                    translation_uk: хата
                    status: review
                    shown_count: 7
                    correct_count: 4
                    incorrect_count: 3
                    streak: 1
                    forgotten_count: 2
                    first_shown_day: "2026-10-20"
                    last_review_day: "2026-10-31"
                    due_on: "2026-11-02"
                    is_weak: true
                has_next: false
                has_prev: false
                next_cursor: null
        "400":
          description: Невалідні параметри запиту (невідома вкладка/сортування, зайвий параметр, курсор не-uuid)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: stats.invalid_request
                message: Невалідні параметри запиту.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/LearnerNotOnboarded" }

  /api/v1/stats/words/{entry_id}:
    get:
      tags: [learning]
      summary: Картка вивченого слова з розбивкою помилок (learned-words-stats US-02)
      operationId: getLearnedWordCard
      description: |
        Розширює рядок списку перекладами й розбивкою помилок (друкарська / діакритична / «не знаю»).
        404, якщо learner цього слова ще не бачив (приховування існування непоказаних слів).
      parameters:
        - in: path
          name: entry_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Картка слова з особистою статистикою
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnedWordCard" }
              example:
                entry_id: 0192f0a0-0000-7000-8000-0000000000e1
                lemma_pl: chata
                transcription_uk: хата
                translation_uk: хата
                status: review
                shown_count: 7
                correct_count: 4
                incorrect_count: 3
                streak: 1
                forgotten_count: 2
                first_shown_day: "2026-10-20"
                last_review_day: "2026-10-31"
                due_on: "2026-11-02"
                is_weak: true
                translations_uk:
                  - { kind: canonical, text_uk: хата }
                mistake_breakdown:
                  typo: 1
                  diacritic: 1
                  dont_know: 1
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Learner цього слова ще не бачив
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: stats.word_not_found
                message: Слово ще не вивчалося.

  /api/v1/stats/summary:
    get:
      tags: [learning]
      summary: Зведення для шапки екрана «Мої слова» (learned-words-stats US-01)
      operationId: getLearnedWordsSummary
      description: |
        Лічильники вкладок рахуються з learner_words.status — те саме джерело, що й «Сьогодні».
        weak_count — скільки слів позначено is_weak.
      responses:
        "200":
          description: Зведення лічильників
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnedWordsSummary" }
              example:
                seen_count: 42
                recalled_count: 18
                review_count: 24
                weak_count: 6
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/LearnerNotOnboarded" }

  /api/v1/content-reports:
    post:
      tags: [content-reports]
      summary: Повідомити про неточність або відсутній запис (US-09)
      operationId: createContentReport
      description: |
        Переклад або транскрипція із запропонованим значенням ідуть на автоматичну звірку
        (ADR-0011, AC-35); інше — у чергу content editor (AC-36). Відсутній запис передає
        `search_query` без `entry_id` (AC-31). Не більше 20 повідомлень на learner за добу learner;
        «Моя відповідь теж правильна» до ліміту не рахується (AC-46, AC-47). Ідентичний повтор
        незакритого report (той самий запис, поле, значення й коментар або пошуковий запит без
        урахування регістру й зайвих пробілів) не створює нового: відповідь 202 з `id` наявного
        report, до ліміту зараховано одне повідомлення (AC-51).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentReportCreate" }
            example:
              origin: card
              entry_id: 0192f0a0-0000-7000-8000-0000000000e1
              field: translation
              proposed_value: державна установа
              comment: Тут краще стандартний відповідник.
      responses:
        "202":
          description: Прийнято на перевірку (AC-34)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentReportAccepted" }
              example:
                id: 0192f0a0-0000-7000-8000-0000000000d2
                status: pending_verification
                message: Дякуємо, передали на перевірку
        "400":
          description: Невалідний report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: report.entry_or_query_required
                message: Вкажіть слово або текст пошуку.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Запис не знайдено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: dictionary.entry_not_found
                message: Слово не знайдено.
        "429":
          description: Вичерпано 20 повідомлень за добу learner (AC-46); клієнт зберігає введені значення у формі
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: report.daily_limit_reached
                message: Сьогоднішній ліміт 20 повідомлень вичерпано — нові можна надіслати після 00:00 за вашим часом.

  /api/v1/editor/content-reports:
    get:
      tags: [editor]
      summary: Черга непідтверджених content reports із розмежуванням за мовою (US-10, US-07)
      operationId: listEditorQueueByLanguage
      description: |
        Лише для content editor; автор показаний псевдонімною міткою (PRD §6.1). Черга
        відокремлює повідомлення за мовою: кожен елемент несе свою `target_language`, а
        необов'язковий фільтр `target_language` звужує набір до однієї мови (AC-11). Без
        фільтра повертає всі мови. Роль редактора єдина для всіх мов, без per-language authz.
      parameters:
        - in: query
          name: target_language
          description: фільтр черги за мовою; без нього — усі мови
          schema: { $ref: "#/components/schemas/TargetLanguageCode" }
        - in: query
          name: after
          schema: { type: string, format: uuid }
        - in: query
          name: before
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Черга від найстаріших
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorQueuePage" }
              example:
                items:
                  - id: 0192f0a0-0000-7000-8000-0000000000d2
                    target_language: pl
                    reporter_alias: R-7F3A9C
                    origin: card
                    entry_id: 0192f0a0-0000-7000-8000-0000000000e1
                    lemma: urząd
                    field: translation
                    current_value: державна установа
                    proposed_value: установа
                    comment: Test comment
                    search_query: null
                    created_at: "2026-10-31T10:00:00Z"
                has_next: false
                has_prev: false
                next_cursor: null
        "400":
          description: Некоректні параметри перегляду
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: editor.invalid_request, message: Перевірте параметри перегляду. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EditorRoleRequired" }

  /api/v1/editor/content-reports/{report_id}/decision:
    post:
      tags: [editor]
      summary: Ухвалити рішення щодо content report (US-10)
      operationId: decideContentReport
      description: |
        `approve` створює нову версію запису з можливістю відкату (AC-38); `reject` закриває з
        причиною без зміни запису (AC-39); `add_to_candidates` додає лему в статусі draft для
        відсутнього запису (AC-40). Результат learner отримує в щоденному підсумку (AC-37).
      parameters:
        - in: path
          name: report_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditorDecision" }
            example:
              decision: reject
              rejection_reason: source_not_confirming
      responses:
        "200":
          description: Рішення застосовано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentReportClosed" }
              example:
                id: 0192f0a0-0000-7000-8000-0000000000d2
                status: closed
                outcome: rejected
                rejection_reason: source_not_confirming
                resulting_version_id: null
                closed_at: "2026-10-31T12:00:00Z"
        "400":
          description: Неповне рішення
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: editor.rejection_reason_required
                message: Вкажіть причину відхилення.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EditorRoleRequired" }
        "404":
          description: Report не знайдено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: report.not_found
                message: Повідомлення не знайдено.
        "409":
          description: Report уже закрито
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: report.already_closed
                message: Це повідомлення вже розглянуто.

  /api/v1/editor/applied-changes:
    get:
      tags: [editor]
      summary: Зміни словника, застосовані за content reports (US-12)
      operationId: listAppliedChanges
      description: |
        Лише для content editor. Публікації, зроблені автоматичною звіркою чи схваленням content
        editor за content report, від нових до старих (AC-48). `rollback_allowed` = true, лише
        коли версія зміни досі опублікована (AC-49).
      parameters:
        - in: query
          name: after
          schema: { type: string, format: uuid }
        - in: query
          name: before
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Застосовані зміни
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppliedChangePage" }
              example:
                items:
                  - id: 0192f0a0-0000-7000-8000-0000000000f1
                    entry_id: 0192f0a0-0000-7000-8000-0000000000e1
                    lemma_pl: urząd
                    field: translation
                    previous_value: державна установа
                    new_value: установа
                    confirmed_by: auto_verification
                    content_report_id: 0192f0a0-0000-7000-8000-0000000000d2
                    applied_at: "2026-10-31T12:00:00Z"
                    rollback_allowed: true
                has_next: false
                has_prev: false
                next_cursor: null
        "400":
          description: Некоректні параметри перегляду
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: editor.invalid_request, message: Перевірте параметри перегляду. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EditorRoleRequired" }

  /api/v1/editor/applied-changes/{change_id}/rollback:
    post:
      tags: [editor]
      summary: Відкотити застосовану зміну до попередньої версії (US-12)
      operationId: rollbackAppliedChange
      description: |
        Повертає опублікований вказівник запису на попередню версію й пише відкат у журнал
        публікацій (AC-48). Word status, відповіді learner, закритий content report і вже
        надісланий результат не змінюються. Відкотити можна лише поточну версію запису (AC-49).
        Повторний виклик для вже відкоченої зміни повертає `editor.rollback_not_current`.
      parameters:
        - in: path
          name: change_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Відкат застосовано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RollbackResult" }
              example:
                change_id: 0192f0a0-0000-7000-8000-0000000000f1
                entry_id: 0192f0a0-0000-7000-8000-0000000000e1
                published_version_id: 0192f0a0-0000-7000-8000-0000000000a9
                rolled_back_at: "2026-10-31T15:00:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/EditorRoleRequired" }
        "404":
          description: Застосовану зміну не знайдено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: editor.change_not_found
                message: Зміну не знайдено.
        "409":
          description: Версія зміни вже не поточна — запис має новішу версію або зміну вже відкочено (AC-49)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: editor.rollback_not_current
                message: Відкотити можна лише поточну версію запису.

  /api/telegram/webhook:
    post:
      tags: [bot]
      summary: Webhook оновлень Telegram
      operationId: receiveTelegramUpdate
      description: |
        Публічний для Telegram: автентифікація заголовком секрету, а не initData. Обробляє `/start`
        з кнопкою Mini App і `my_chat_member` (блокування бота вимикає нагадування). Помилки
        обробника логуються, а відповідь лишається успішною, щоб Telegram не повторював update.
      security: []
      parameters:
        - in: header
          name: X-Telegram-Bot-Api-Secret-Token
          required: true
          schema: { type: string, maxLength: 256 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramUpdate" }
            example:
              update_id: 100000001
              message:
                message_id: 1
                text: /start
                chat: { id: 900000001, type: private }
                from: { id: 900000001, first_name: Test User }
      responses:
        "200":
          description: Прийнято
        "401":
          description: Невірний секрет webhook
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: webhook.invalid_secret
                message: Невірний секрет.

  /api/v1/telemetry/client-timings:
    post:
      tags: [telemetry]
      summary: Клієнтські метрики часу — відкриття «Сьогодні» й перемикання мови (PRD §6, SAD §7)
      operationId: reportClientTiming
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientTiming" }
            example:
              metric: today_ready_ms
              value_ms: 840
      responses:
        "204":
          description: Прийнято
        "400":
          description: Невідома метрика або значення поза межами
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: telemetry.invalid_metric
                message: Невідома метрика.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/learners/me/progress/reset:
    post:
      tags: [learner]
      summary: Скинути весь навчальний прогрес (reset-progress US-01, US-02, US-04)
      operationId: resetLearnerProgress
      description: |
        Атомарно стирає прогрес поточного learner за одну транзакцію (reset-progress ADR-0001): стан
        слів, усі session будь-якого виду з картками, відповіді та нейтралізації оскаржень. Профіль,
        налаштування й content reports лишаються. Тіло порожнє; ідентичність — лише з initData (AC-05).
        Повторний виклик на порожньому прогресі повертає успіх без змін (AC-09), тож Idempotency-Key
        не потрібен — повтор безпечний за станом.
      responses:
        "200":
          description: Прогрес скинуто (або вже порожній)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressResetResult" }
              examples:
                erased:
                  value: { erased: true }
                already_empty:
                  value: { erased: false }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/LearnerNotOnboarded" }
        "500":
          description: Скидання не завершено, транзакцію відкочено — прогрес лишився без змін (AC-04)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: progress_reset.failed
                message: Не вдалося скинути прогрес. Нічого не змінено — спробуйте ще раз.

components:
  securitySchemes:
    TelegramInitData:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Значення `tma <initData>` — рядок запуску Mini App, підписаний Telegram. Сервер перевіряє
        HMAC-SHA256 з ключем від bot token і свіжість `auth_date` (не старше 24 год). Learner
        визначається лише з цих даних, ніколи з URL (ADR-0005).

  parameters:
    SessionId:
      in: path
      name: session_id
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      in: path
      name: item_id
      required: true
      schema: { type: string, format: uuid }

  examples:
    SessionExample:
      value:
        id: 0192f0a0-0000-7000-8000-0000000000a1
        learner_day: "2026-10-31"
        ends_at: "2026-10-31T23:00:00Z"
        status: active
        kind: plan
        total_items: 7
        completed_items: 2
        notices: []
        last_result: null
        current_item:
          id: 0192f0a0-0000-7000-8000-0000000000b3
          position: 3
          kind: review
          prompt_uk: так
          context_uk: null
          card: null

  responses:
    Unauthorized:
      description: Немає або невалідні initData, або вони старші за 24 год
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: auth.invalid_init_data
            message: Перевідкрийте тренер у Telegram.
    LearnerNotOnboarded:
      description: Онбординг ще не завершено
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: learner.not_onboarded
            message: Спершу налаштуйте тренер.
    SessionItemNotFound:
      description: Session або картки немає серед session цього learner (приховування існування)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: session.item_not_found
            message: Картку не знайдено.
    SessionExpired:
      description: Доба session минула — дію не зараховано, session закрито (AC-25, AC-52)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: session.expired
            message: Заняття минулої доби закрито — почніть нове.
    EditorRoleRequired:
      description: Користувач не має ролі content editor (AC-41, AC-50)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: editor.role_required
            message: Розгляд повідомлень доступний лише редактору.

  schemas:
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: "^[a-z_]+\\.[a-z_]+$"
          example: session.expired
        message: { type: string }
        details:
          type: object
          description: необов'язковий структурований контекст (поля з помилками тощо)

    ProgressResetResult:
      type: object
      required: [erased]
      additionalProperties: false
      description: Результат скидання прогресу (reset-progress).
      properties:
        erased:
          type: boolean
          description: true — були дані навчання й їх стерто; false — прогрес уже був порожнім, нічого не змінено

    DailyNewWordsLimit:
      type: integer
      minimum: 1
      maximum: 10
      description: learners.daily_new_words_limit (SMALLINT); від 1 до 10 нових слів на день (AC-45)

    TimeZone:
      type: string
      maxLength: 64
      description: IANA id; learners.time_zone VARCHAR(64)
      example: Europe/Warsaw

    DayOfWeek:
      type: string
      enum: [mon, tue, wed, thu, fri, sat, sun]

    ReminderSchedule:
      type: object
      required: [local_time, days_of_week]
      additionalProperties: false
      properties:
        local_time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: reminder_schedules.local_time (TIME) у поясі learner
        days_of_week:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/DayOfWeek" }
          description: reminder_schedules.days_of_week (бітова маска); хоча б один день (AC-02)

    OnboardingRequest:
      type: object
      required: [daily_new_words_limit]
      additionalProperties: false
      properties:
        daily_new_words_limit: { $ref: "#/components/schemas/DailyNewWordsLimit" }
        time_zone:
          oneOf:
            - $ref: "#/components/schemas/TimeZone"
            - type: "null"
        reminder:
          oneOf:
            - $ref: "#/components/schemas/ReminderSchedule"
            - type: "null"

    LearnerSettingsUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        daily_new_words_limit: { $ref: "#/components/schemas/DailyNewWordsLimit" }
        time_zone: { $ref: "#/components/schemas/TimeZone" }
        reminder:
          oneOf:
            - $ref: "#/components/schemas/ReminderSchedule"
            - type: "null"

    Learner:
      type: object
      required: [id, time_zone, time_zone_confirmed, daily_new_words_limit, reminder, onboarded_at, active_target_language]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        first_name: { type: [string, "null"], maxLength: 64 }
        time_zone: { $ref: "#/components/schemas/TimeZone" }
        time_zone_confirmed: { type: boolean }
        daily_new_words_limit: { $ref: "#/components/schemas/DailyNewWordsLimit" }
        pending_daily_new_words_limit:
          oneOf:
            - $ref: "#/components/schemas/DailyNewWordsLimit"
            - type: "null"
        reminder:
          oneOf:
            - $ref: "#/components/schemas/ReminderSchedule"
            - type: "null"
        onboarded_at: { type: [string, "null"], format: date-time }
        active_target_language:
          description: learners.active_target_language; null, якщо learner ще не обрав мову (налаштування доби й нагадування — для активної мови)
          oneOf:
            - $ref: "#/components/schemas/TargetLanguageCode"
            - type: "null"

    LearnerAccess:
      type: object
      required: [content_editor]
      additionalProperties: false
      properties:
        content_editor: { type: boolean, description: "true, якщо Telegram id користувача є в списку редакторів контенту" }

    TargetLanguageCode:
      type: string
      pattern: "^[a-z]{2}$"
      maxLength: 2
      description: target_languages.code (VARCHAR(2)) — ISO-639-1 код; збігається з search_forms.lang/morph_forms.lang
      example: en

    TargetLanguage:
      type: object
      required: [code, display_name_uk, is_enabled, sort_order, available]
      additionalProperties: false
      description: Елемент каталогу мов (target_languages, ADR-0004). normalization_profile не експонується — внутрішнє рішення коду (OQ-5).
      properties:
        code: { $ref: "#/components/schemas/TargetLanguageCode" }
        display_name_uk:
          type: string
          maxLength: 64
          description: target_languages.display_name_uk (VARCHAR(64)) — укр. назва мови
        is_enabled:
          type: boolean
          description: target_languages.is_enabled — адмін-перемикач доступності мови
        sort_order:
          type: integer
          minimum: 0
          maximum: 32767
          description: target_languages.sort_order (SMALLINT) — порядок у списку
        available:
          type: boolean
          description: обчислюється сервером — is_enabled І наявний схвалений контент; лише такі мови learner може почати (AC-01, AC-02)

    TargetLanguageCatalog:
      type: object
      required: [items]
      additionalProperties: false
      description: Повний каталог мов без пагінації (обмежений набір — девіація від курсорного дефолту).
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TargetLanguage" }

    LearnerLanguage:
      type: object
      required: [target_language, display_name_uk, is_active, started_at]
      additionalProperties: false
      description: Мова, яку learner вивчає (рядок learner_language_states).
      properties:
        target_language: { $ref: "#/components/schemas/TargetLanguageCode" }
        display_name_uk: { type: string, maxLength: 64 }
        is_active:
          type: boolean
          description: true, якщо це learners.active_target_language
        started_at:
          type: string
          format: date-time
          description: learner_language_states.created_at — момент старту мови learner-ом

    LearnerLanguages:
      type: object
      required: [active_target_language, items]
      additionalProperties: false
      properties:
        active_target_language:
          oneOf:
            - $ref: "#/components/schemas/TargetLanguageCode"
            - type: "null"
          description: learners.active_target_language; null, якщо learner ще не обрав мову
        items:
          type: array
          items: { $ref: "#/components/schemas/LearnerLanguage" }

    StartLanguageRequest:
      type: object
      required: [target_language]
      additionalProperties: false
      properties:
        target_language: { $ref: "#/components/schemas/TargetLanguageCode" }

    SetActiveLanguageRequest:
      type: object
      required: [target_language]
      additionalProperties: false
      properties:
        target_language: { $ref: "#/components/schemas/TargetLanguageCode" }

    ActiveLanguage:
      type: object
      required: [active_target_language]
      additionalProperties: false
      properties:
        active_target_language: { $ref: "#/components/schemas/TargetLanguageCode" }

    WordStatus:
      type: string
      enum: [not_started, review, recalled]
      description: learner_words.status; «Ще не вчив» / «На повторення» / «Вже пригадую»

    TodaySummary:
      type: object
      required: [learner_day, due_review_count, recalled_words_count, completed_sessions_last_7_days, has_active_session, course_state, course_replenished_notice, new_words_available_today, extra_actions]
      additionalProperties: false
      properties:
        learner_day: { type: string, format: date }
        due_review_count: { type: integer, minimum: 0 }
        recalled_words_count: { type: integer, minimum: 0 }
        completed_sessions_last_7_days: { type: integer, minimum: 0, description: "лише заняття kind = plan (unlimited-learning): extra-заняття не рахуються" }
        has_active_session: { type: boolean }
        course_state: { type: string, enum: [in_progress, completed] }
        course_replenished_notice: { type: boolean, description: одноразове повідомлення про поповнення base course (AC-10) }
        new_words_available_today: { type: boolean, description: "false, якщо денний ліміт нових слів вичерпано або нових слів поки немає; повторення від цього не залежать" }
        extra_actions: { $ref: "#/components/schemas/ExtraActions" }

    SessionNotice:
      type: string
      enum: [new_words_limit_reached, course_completed, course_replenished]

    NewWordCard:
      type: object
      required: [lemma_pl, translations_uk, pronunciation_uk, example_pl, example_uk, gender]
      additionalProperties: false
      properties:
        lemma_pl: { type: string, maxLength: 200 }
        translations_uk:
          type: array
          items: { type: string, maxLength: 200 }
        pronunciation_uk: { type: string, maxLength: 200 }
        example_pl: { type: string, maxLength: 500 }
        example_uk: { type: string, maxLength: 500 }
        gender: { type: [string, "null"], maxLength: 8 }

    SessionItem:
      type: object
      required: [id, position, kind, prompt_uk, context_uk, card]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, minimum: 1, maximum: 50, description: Ключ порядку фізичних карток; може мати пропуски й не є номером серед total_items. }
        kind: { type: string, enum: [review, new_word_card, new_word_check, control_repetition, extra_new_word_check, extra_practice], description: "extra_new_word_check і extra_practice — картки extra-занять (unlimited-learning); new_word_card використовується й для extra_word" }
        prompt_uk: { type: string, maxLength: 200, description: українська підказка для вправи }
        context_uk:
          type: [string, "null"]
          maxLength: 500
          description: example_uk до відповіді, якщо show_context_before
        card:
          oneOf:
            - $ref: "#/components/schemas/NewWordCard"
            - type: "null"
          description: лише для kind = new_word_card

    Session:
      type: object
      required: [id, learner_day, ends_at, status, kind, target_language, total_items, completed_items, notices, current_item, last_result]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        learner_day: { type: string, format: date }
        ends_at: { type: string, format: date-time }
        status: { type: string, enum: [active, completed, incomplete] }
        kind: { $ref: "#/components/schemas/SessionKind" }
        target_language:
          $ref: "#/components/schemas/TargetLanguageCode"
          description: Мова, якій належить це заняття (learning_sessions.target_language). Текст вправи й поле відповіді показуються цією мовою, а не поточною активною мовою learner.
        total_items: { type: integer, minimum: 0, maximum: 50, description: Кількість фізичних карток разом із перевірками; ліміт session залишається 20 слів. }
        completed_items: { type: integer, minimum: 0, maximum: 50, description: Кількість опрацьованих або пропущених фізичних карток. }
        notices:
          type: array
          items: { $ref: "#/components/schemas/SessionNotice" }
        current_item:
          oneOf:
            - $ref: "#/components/schemas/SessionItem"
            - type: "null"

        last_result:
          oneOf:
            - $ref: "#/components/schemas/LastResult"
            - type: "null"
          description: Відкритий результат; перед показом наступної картки викличте continueSession.

    SessionKind:
      type: string
      enum: [plan, extra_word, extra_practice]
      description: "Тип заняття (unlimited-learning, ADR-0001): plan — планове заняття дня; extra_word — додаткове нове слово понад план; extra_practice — додаткова практика вивчених слів."

    ExtraActionAvailability:
      type: object
      required: [available, reason]
      additionalProperties: false
      properties:
        available: { type: boolean }
        reason:
          type: [string, "null"]
          enum: [plan_not_done, course_completed, no_eligible_words, null]
          description: Чому дія недоступна; null, якщо available = true.

    ExtraActions:
      type: object
      required: [plan_done, extra_new_word, extra_practice]
      additionalProperties: false
      description: "Доступність додаткових дій екрана «Сьогодні» (unlimited-learning). Лише сервер вирішує доступність (AC-16, AC-17)."
      properties:
        plan_done:
          type: boolean
          description: true, якщо слів до повторення немає, активної session немає і нових слів на сьогодні немає (ліміт вичерпано або base course завершено).
        extra_new_word: { $ref: "#/components/schemas/ExtraActionAvailability" }
        extra_practice: { $ref: "#/components/schemas/ExtraActionAvailability" }

    LastResult:
      type: object
      required: [item_id, answer, dispute]
      additionalProperties: false
      properties:
        item_id: { type: string, format: uuid }
        answer: { $ref: "#/components/schemas/AnswerResult" }
        dispute:
          oneOf:
            - $ref: "#/components/schemas/DisputeResult"
            - type: "null"

    SessionProgress:
      type: object
      required: [next_item, session_completed]
      additionalProperties: false
      properties:
        next_item:
          oneOf:
            - $ref: "#/components/schemas/SessionItem"
            - type: "null"
        session_completed: { type: boolean }

    AnswerRequest:
      type: object
      required: [dont_know]
      additionalProperties: false
      properties:
        answer: { type: [string, "null"], maxLength: 200 }
        dont_know: { type: boolean }

    DiffSegment:
      type: object
      required: [op, expected, actual]
      additionalProperties: false
      properties:
        op: { type: string, enum: [equal, insert, delete, substitute] }
        expected: { type: string }
        actual: { type: string }

    AnswerOutcome:
      type: string
      enum: [correct, mistake_typo, mistake_diacritic, dont_know, synonym]
      description: answer_events.outcome для вправи пригадування; synonym — нейтральна відповідь (AC-56)

    AnswerResult:
      description: next_item є попереднім переглядом; перехід відбувається лише через continueSession.
      type: object
      required: [answer_event_id, outcome, correct_form, diff, pronunciation_uk, example_pl, example_uk, gender, dispute_allowed, word_status, next_review_on, next_item, session_completed]
      additionalProperties: false
      properties:
        answer_event_id: { type: string, format: uuid }
        outcome: { $ref: "#/components/schemas/AnswerOutcome" }
        correct_form: { type: string, maxLength: 200 }
        diff:
          type: array
          items: { $ref: "#/components/schemas/DiffSegment" }
        pronunciation_uk: { type: string, maxLength: 200 }
        example_pl: { type: string, maxLength: 500 }
        example_uk: { type: string, maxLength: 500 }
        gender: { type: [string, "null"], maxLength: 8 }
        dispute_allowed: { type: boolean, description: дія «Моя відповідь теж правильна» доступна (AC-16), недоступна для діакритики (AC-15) }
        word_status: { $ref: "#/components/schemas/WordStatus" }
        next_review_on: { type: [string, "null"], format: date }
        next_item:
          oneOf:
            - $ref: "#/components/schemas/SessionItem"
            - type: "null"
        session_completed: { type: boolean }

    AlreadyKnownResult:
      type: object
      required: [control_repetition_on, replacement_added, next_item, session_completed]
      additionalProperties: false
      properties:
        control_repetition_on: { type: string, format: date }
        replacement_added: { type: boolean }
        next_item:
          oneOf:
            - $ref: "#/components/schemas/SessionItem"
            - type: "null"
        session_completed: { type: boolean }

    DisputeResult:
      type: object
      required: [outcome, content_report_id, message]
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [neutralized] }
        content_report_id: { type: string, format: uuid }
        message: { type: string }

    DictionarySearchItem:
      type: object
      required: [entry_id, lemma_pl, part_of_speech, short_meaning_uk, matched_form, word_status]
      additionalProperties: false
      properties:
        entry_id: { type: string, format: uuid }
        lemma_pl: { type: string, maxLength: 200 }
        part_of_speech: { type: string, maxLength: 32 }
        short_meaning_uk: { type: string, maxLength: 200 }
        matched_form: { type: string, maxLength: 200 }
        word_status: { $ref: "#/components/schemas/WordStatus" }

    DictionarySearchPage:
      type: object
      required: [items, has_next, has_prev, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DictionarySearchItem" }
        has_next: { type: boolean }
        has_prev: { type: boolean }
        next_cursor: { type: [string, "null"], format: uuid }

    Translation:
      type: object
      required: [kind, text_uk]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [canonical, variant, local] }
        text_uk: { type: string, maxLength: 200 }

    DictionaryEntryCard:
      type: object
      required: [entry_id, lemma_pl, part_of_speech, gender, translations_uk, pronunciation_uk, example_pl, example_uk, word_status]
      additionalProperties: false
      properties:
        entry_id: { type: string, format: uuid }
        lemma_pl: { type: string, maxLength: 200 }
        part_of_speech: { type: string, maxLength: 32 }
        gender: { type: [string, "null"], maxLength: 8 }
        translations_uk:
          type: array
          items: { $ref: "#/components/schemas/Translation" }
        pronunciation_uk: { type: string, maxLength: 200 }
        example_pl: { type: string, maxLength: 500 }
        example_uk: { type: string, maxLength: 500 }
        word_status: { $ref: "#/components/schemas/WordStatus" }

    StatsTab:
      type: string
      enum: [all, recalled, review]
      default: all
      description: Вкладка фільтра за learner_words.status; all — усі побачені слова (learned-words-stats).

    StatsSort:
      type: string
      enum: [recent, alpha, weakest]
      default: recent
      description: recent — за останнім повторенням; alpha — за лемою; weakest — спершу найслабші.

    MistakeBreakdown:
      type: object
      required: [typo, diacritic, dont_know]
      additionalProperties: false
      description: Кількість зарахованих помилок за типом (успішно оскаржені друкарські не враховуються).
      properties:
        typo: { type: integer, minimum: 0, description: mistake_typo за винятком успішно оскаржених }
        diacritic: { type: integer, minimum: 0 }
        dont_know: { type: integer, minimum: 0 }

    LearnedWordStat:
      type: object
      required: [entry_id, lemma_pl, transcription_uk, translation_uk, status, shown_count, correct_count, incorrect_count, streak, forgotten_count, first_shown_day, last_review_day, due_on, is_weak]
      additionalProperties: false
      properties:
        entry_id: { type: string, format: uuid }
        lemma_pl: { type: string, maxLength: 200 }
        transcription_uk: { type: [string, "null"], maxLength: 200, description: "вимова українською; null, якщо запис втратив публікацію" }
        translation_uk: { type: string, maxLength: 200, description: "канонічний переклад (перший серед translations_uk)" }
        status: { $ref: "#/components/schemas/WordStatus" }
        shown_count: { type: integer, minimum: 0, description: "показ — кількість зарахованих спроб (review / control_repetition / extra_practice)" }
        correct_count: { type: integer, minimum: 0 }
        incorrect_count: { type: integer, minimum: 0, description: "помилки за винятком успішно оскаржених" }
        streak: { type: integer, minimum: 0, description: "learner_words.consecutive_scheduled_correct" }
        forgotten_count: { type: integer, minimum: 0, description: "learner_words.lapses — скільки разів забув" }
        first_shown_day: { type: [string, "null"], format: date }
        last_review_day: { type: [string, "null"], format: date }
        due_on: { type: [string, "null"], format: date }
        is_weak: { type: boolean, description: "status != recalled і (forgotten_count > 0 або incorrect_count > 0)" }

    LearnedWordCard:
      # Поля LearnedWordStat повторено явно (а не через allOf): additionalProperties:false на базовій
      # схемі під allOf відкидає translations_uk / mistake_breakdown, тож картка — самостійний strict-об'єкт.
      type: object
      required: [entry_id, lemma_pl, transcription_uk, translation_uk, status, shown_count, correct_count, incorrect_count, streak, forgotten_count, first_shown_day, last_review_day, due_on, is_weak, translations_uk, mistake_breakdown]
      additionalProperties: false
      properties:
        entry_id: { type: string, format: uuid }
        lemma_pl: { type: string, maxLength: 200 }
        transcription_uk: { type: [string, "null"], maxLength: 200, description: "вимова українською; null, якщо запис втратив публікацію" }
        translation_uk: { type: string, maxLength: 200, description: "канонічний переклад (перший серед translations_uk)" }
        status: { $ref: "#/components/schemas/WordStatus" }
        shown_count: { type: integer, minimum: 0, description: "показ — кількість зарахованих спроб (review / control_repetition / extra_practice)" }
        correct_count: { type: integer, minimum: 0 }
        incorrect_count: { type: integer, minimum: 0, description: "помилки за винятком успішно оскаржених" }
        streak: { type: integer, minimum: 0, description: "learner_words.consecutive_scheduled_correct" }
        forgotten_count: { type: integer, minimum: 0, description: "learner_words.lapses — скільки разів забув" }
        first_shown_day: { type: [string, "null"], format: date }
        last_review_day: { type: [string, "null"], format: date }
        due_on: { type: [string, "null"], format: date }
        is_weak: { type: boolean, description: "status != recalled і (forgotten_count > 0 або incorrect_count > 0)" }
        translations_uk:
          type: array
          items: { $ref: "#/components/schemas/Translation" }
        mistake_breakdown: { $ref: "#/components/schemas/MistakeBreakdown" }

    LearnedWordsPage:
      type: object
      required: [items, has_next, has_prev, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LearnedWordStat" }
        has_next: { type: boolean }
        has_prev: { type: boolean }
        next_cursor: { type: [string, "null"], format: uuid }

    LearnedWordsSummary:
      type: object
      required: [seen_count, recalled_count, review_count, weak_count]
      additionalProperties: false
      properties:
        seen_count: { type: integer, minimum: 0, description: "усі побачені слова" }
        recalled_count: { type: integer, minimum: 0, description: "learner_words.status = recalled" }
        review_count: { type: integer, minimum: 0, description: "learner_words.status = review" }
        weak_count: { type: integer, minimum: 0, description: "скільки слів is_weak" }

    ReportField:
      type: string
      enum: [lemma, translation, pronunciation, example]

    ContentReportCreate:
      type: object
      required: [origin]
      additionalProperties: false
      properties:
        origin: { type: string, enum: [card, missing_word] }
        entry_id: { type: [string, "null"], format: uuid }
        field:
          oneOf:
            - $ref: "#/components/schemas/ReportField"
            - type: "null"
        proposed_value: { type: [string, "null"], maxLength: 500 }
        comment: { type: [string, "null"], maxLength: 1000 }
        search_query: { type: [string, "null"], maxLength: 200 }

    ContentReportAccepted:
      type: object
      required: [id, status, message]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending_verification, in_editor_queue] }
        message: { type: string }

    EditorQueueItem:
      type: object
      required: [id, target_language, reporter_alias, origin, entry_id, lemma, field, current_value, proposed_value, comment, search_query, created_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        target_language: { $ref: "#/components/schemas/TargetLanguageCode" }
        reporter_alias: { type: string, maxLength: 16, description: псевдонімна мітка, без імені й Telegram id }
        origin: { type: string, enum: [card, answer_dispute, missing_word] }
        entry_id: { type: [string, "null"], format: uuid }
        lemma: { type: [string, "null"], maxLength: 200, description: лема запису активної мови повідомлення }
        field:
          oneOf:
            - $ref: "#/components/schemas/ReportField"
            - type: "null"
        current_value: { type: [string, "null"], maxLength: 500 }
        proposed_value: { type: [string, "null"], maxLength: 500 }
        comment: { type: [string, "null"], maxLength: 1000, description: показувати лише як звичайний текст }
        search_query: { type: [string, "null"], maxLength: 200 }
        created_at: { type: string, format: date-time }

    EditorQueuePage:
      type: object
      required: [items, has_next, has_prev, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EditorQueueItem" }
        has_next: { type: boolean }
        has_prev: { type: boolean }
        next_cursor: { type: [string, "null"], format: uuid }

    RejectionReason:
      type: string
      enum: [source_not_confirming, already_correct, out_of_scope, duplicate, already_in_dictionary, phrase_not_lemma]

    EditorDecision:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision: { type: string, enum: [approve, reject, add_to_candidates] }
        rejection_reason:
          oneOf:
            - $ref: "#/components/schemas/RejectionReason"
            - type: "null"
        corrected_value: { type: [string, "null"], maxLength: 500, description: остаточне значення, якщо редактор уточнює запропоноване }

    ContentReportClosed:
      type: object
      required: [id, status, outcome, rejection_reason, resulting_version_id, closed_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [closed] }
        outcome: { type: string, enum: [applied, added_to_candidates, rejected] }
        rejection_reason:
          oneOf:
            - $ref: "#/components/schemas/RejectionReason"
            - type: "null"
        resulting_version_id: { type: [string, "null"], format: uuid }
        closed_at: { type: string, format: date-time }

    AppliedChange:
      type: object
      required: [id, entry_id, lemma_pl, field, previous_value, new_value, confirmed_by, content_report_id, applied_at, rollback_allowed]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: ідентифікатор рядка журналу публікацій }
        entry_id: { type: string, format: uuid }
        lemma_pl: { type: string, maxLength: 200 }
        field:
          type: string
          enum: [lemma, translation, pronunciation, example, accepted_answer]
          description: accepted_answer позначає доданий варіант відповіді; previous_value тоді null, new_value містить фактично схвалений варіант.
        previous_value: { type: [string, "null"], maxLength: 500 }
        new_value: { type: string, maxLength: 500 }
        confirmed_by: { type: string, enum: [auto_verification, editor] }
        content_report_id: { type: string, format: uuid }
        applied_at: { type: string, format: date-time }
        rollback_allowed: { type: boolean }

    AppliedChangePage:
      type: object
      required: [items, has_next, has_prev, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AppliedChange" }
        has_next: { type: boolean }
        has_prev: { type: boolean }
        next_cursor: { type: [string, "null"], format: uuid }

    RollbackResult:
      type: object
      required: [change_id, entry_id, published_version_id, rolled_back_at]
      additionalProperties: false
      properties:
        change_id: { type: string, format: uuid }
        entry_id: { type: string, format: uuid }
        published_version_id: { type: string, format: uuid, description: попередня версія, що знову опублікована }
        rolled_back_at: { type: string, format: date-time }

    TelegramUpdate:
      type: object
      description: Об'єкт Update з Telegram Bot API; контракт визначає Telegram, сервер читає лише потрібні поля.
      required: [update_id]
