name: Перевірки бекенду

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Збирання й тести PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - name: Отримати код
        uses: actions/checkout@v7
      - name: Налаштувати .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Перевірити Docker
        run: docker info
      - name: Зібрати бекенд
        run: dotnet build ConstantLearning.slnx --configuration Release
      - name: Виконати unit, integration і contract тести
        run: dotnet test ConstantLearning.Tests/ConstantLearning.Tests.csproj --no-build --configuration Release --verbosity normal
