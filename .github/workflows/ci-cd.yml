name: Перевірки, образ і production-деплой

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: "Тести бекенду та образ"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ steps.owner.outputs.owner_lc }}/constant-learning
      digest: ${{ steps.publish.outputs.digest }}
    env:
      CI: 'true'

    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Налаштувати .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Перевірити Docker для обов'язкових PostgreSQL-тестів
        run: docker info

      - name: Зібрати бекенд
        run: dotnet build ConstantLearning.slnx --configuration Release

      - name: Виконати unit, integration і contract тести
        run: dotnet test ConstantLearning.Tests/ConstantLearning.Tests.csproj --no-build --verbosity normal --configuration Release

      - name: Нормалізувати назву власника образу
        id: owner
        run: printf 'owner_lc=%s\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Налаштувати Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Увійти до GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Зібрати та опублікувати образ
        id: publish
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ConstantLearning/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ steps.owner.outputs.owner_lc }}/constant-learning:${{ env.IMAGE_TAG }}

  deploy-production:
    name: Розгорнути production
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTOMATIC_DEPLOYMENT_ENABLED == 'true'
    runs-on: [self-hosted, Linux, X64, constant-learning-deploy]
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: constant-learning-production
      cancel-in-progress: false
    steps:
      - name: Отримати перевірений коміт
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Застосувати образ і перевірити здоров’я
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_IMAGE: ${{ needs.build-and-push.outputs.image }}
          DEPLOY_DIGEST: ${{ needs.build-and-push.outputs.digest }}
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG }}
          CONNECTIONSTRINGS__DEFAULTCONNECTION: ${{ secrets.CONNECTIONSTRINGS__DEFAULTCONNECTION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SECRET_TOKEN: ${{ secrets.TELEGRAM_SECRET_TOKEN }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: python3 -u tools/deployment/deploy.py
