name: Збирання та публікація образу

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: "Тести бекенду та образ"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'

    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Налаштувати .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Перевірити Docker для обов'язкових PostgreSQL-тестів
        run: docker info

      - name: Зібрати бекенд
        run: dotnet build ConstantLearning.slnx --configuration Release

      - name: Виконати unit, integration і contract тести
        run: dotnet test ConstantLearning.Tests/ConstantLearning.Tests.csproj --no-build --verbosity normal --configuration Release

      - name: Нормалізувати назву власника образу
        id: owner
        run: printf 'owner_lc=%s\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Налаштувати Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Увійти до GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Зібрати та опублікувати образ
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ConstantLearning/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ steps.owner.outputs.owner_lc }}/constant-learning:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_REGISTRY }}/${{ steps.owner.outputs.owner_lc }}/constant-learning:latest
